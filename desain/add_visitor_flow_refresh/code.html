<script>
    document.addEventListener('DOMContentLoaded', () => {
      const steps = document.querySelectorAll('.form-step');
      const nextBtns = document.querySelectorAll('.next-btn');
      const prevBtns = document.querySelectorAll('.prev-btn');
      const progressSteps = document.querySelectorAll('.progress-step');
      const progressBars = document.querySelectorAll('.progress-bar');
      
      let currentStep = 0;

      function showStep(index) {
        steps.forEach((step, i) => {
          if (i === index) {
            step.classList.remove('hidden');
          } else {
            step.classList.add('hidden');
          }
        });

        progressSteps.forEach((indicator, i) => {
          if (i <= index) {
            indicator.classList.remove('bg-surface-variant', 'text-on-surface-variant');
            indicator.classList.add('bg-primary', 'text-on-primary');
          } else {
            indicator.classList.remove('bg-primary', 'text-on-primary');
            indicator.classList.add('bg-surface-variant', 'text-on-surface-variant');
          }
        });

        progressBars.forEach((bar, i) => {
          if (i < index) {
            bar.classList.remove('bg-surface-variant');
            bar.classList.add('bg-primary');
          } else {
            bar.classList.remove('bg-primary');
            bar.classList.add('bg-surface-variant');
          }
        });
      }

      nextBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentStep < steps.length - 1) {
            currentStep++;
            showStep(currentStep);
          }
        });
      });

      prevBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentStep > 0) {
            currentStep--;
            showStep(currentStep);
          }
        });
      });
    });
  </script>
